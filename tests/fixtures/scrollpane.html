<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scroll pane</title>
<style>
  /* App-style page (like a chat or mail app): the page itself is locked, only the panel scrolls. */
  html,body{margin:0;overflow:hidden;font:16px system-ui}
  h1{margin:0;height:40px;font-size:16px;padding:8px}
  #pane{height:420px;width:600px;margin:20px auto;overflow-y:auto;border:1px solid #888}
  .row{height:60px;border-bottom:1px solid #ddd;padding:8px;box-sizing:border-box}
  /* makes the locked page report a large scrollHeight even though it can never move: the trap for naive scrolling */
  .tall{position:absolute;top:0;left:0;width:1px;height:3000px;pointer-events:none}
</style>
</head>
<body>
  <h1>App-style page: only the panel scrolls</h1>
  <div class="tall"></div>
  <div id="pane"></div>
<script>
  const pane = document.getElementById('pane');
  for (let i = 1; i <= 80; i++) pane.insertAdjacentHTML('beforeend', `<div class="row">Message ${i}</div>`);
</script>
</body>
</html>
