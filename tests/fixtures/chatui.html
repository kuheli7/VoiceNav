<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ChatGPT-style layout (mock)</title>
<style>
  /* A MOCK of the parts of ChatGPT's layout that gave trouble: a scrolling left sidebar of chats, icon-only buttons with only a
     data-testid or aria-label, a thread that scrolls inside an upside-down (column-reverse) box, a search palette without a form. */
  html, body { margin:0; height:100%; overflow:hidden; font:15px system-ui; }
  #side { position:fixed; left:0; top:0; bottom:0; width:260px; overflow-y:auto; background:#f4f4f4; }
  #side a, #side button { display:block; padding:8px 12px; text-decoration:none; color:#111; }
  #main { margin-left:260px; height:100vh; position:relative; }
  #thread { height:calc(100vh - 110px); overflow-y:auto; display:flex; flex-direction:column-reverse; }
  .msg { padding:14px 24px; border-bottom:1px solid #eee; }
  #composer { position:absolute; left:20px; right:20px; bottom:14px; border:1px solid #bbb; border-radius:20px; padding:8px; display:flex; gap:8px; align-items:center; background:#fff; }
  #prompt-textarea { flex:1; min-height:24px; outline:none; }
  #composer button { width:34px; height:34px; border-radius:50%; border:1px solid #999; background:#fff; }
  #searchdlg { position:fixed; top:20%; left:35%; width:420px; background:#fff; border:1px solid #888; padding:12px; z-index:10; }
  #searchdlg[hidden], #proj[hidden] { display:none; }
  #proj { padding:20px; }
</style></head>
<body>
<nav id="side" aria-label="Chat history">
  <button type="button" data-testid="open-sidebar-button" aria-label="Close sidebar"><svg width="16" height="16"><rect width="16" height="16"/></svg></button>
  <button type="button" id="searchbtn" aria-label="Search chats" data-testid="search-btn"><svg width="16" height="16"><circle cx="8" cy="8" r="6"/></svg></button>
  <a href="#new" id="newchat">New chat</a>
  <a href="#projects" id="projects">Projects</a>
  <a href="#alpha" id="alpha">Alpha project</a>
  <a href="#beta" id="beta">Beta project</a>
  <div id="chats"></div>
</nav>
<div id="main">
  <div id="proj" hidden><h2>Alpha project</h2><button type="button" id="projchat">New chat in Alpha project</button></div>
  <div id="thread"></div>
  <form id="composer" onsubmit="return false">
    <button type="button" data-testid="composer-plus-btn" aria-label="Add files and more" id="plus"><svg width="14" height="14"><path d="M7 0v14M0 7h14"/></svg></button>
    <div id="prompt-textarea" contenteditable="true" role="textbox" aria-label="Message" data-placeholder="Ask anything"></div>
    <button type="button" aria-label="Dictate button" id="mic"><svg width="14" height="14"><rect width="6" height="12" x="4"/></svg></button>
    <button type="button" data-testid="send-button" aria-label="Send prompt" id="send" disabled><svg width="14" height="14"><path d="M7 14V0"/></svg></button>
  </form>
</div>
<div id="searchdlg" role="dialog" aria-label="Search chats" hidden><input id="q" placeholder="Search chats..." aria-label="Search chats"></div>
<script>
  window.__sent = []; window.__clicks = [];
  const titles = ["Python loops", "Python loops vs recursion", "Recipe ideas", "Trip to Goa", "Resume review", "Cover letter draft", "SQL joins explained", "Gym plan", "Birthday gift ideas", "Chat about movies"];
  const chats = document.getElementById("chats");
  for (let i = 0; i < 60; i++) { const a = document.createElement("a"); a.href = "#c" + i; a.textContent = titles[i % titles.length] + (i >= titles.length ? " " + (Math.floor(i / titles.length) + 1) : ""); a.className = "chat"; chats.append(a); }
  const thread = document.getElementById("thread");
  for (let i = 80; i >= 1; i--) { const d = document.createElement("div"); d.className = "msg"; d.textContent = "Message number " + i; thread.append(d); } // first child sits at the bottom
  const box = document.getElementById("prompt-textarea"), send = document.getElementById("send");
  const sync = () => { send.disabled = !box.innerText.trim(); };
  box.addEventListener("input", sync);
  send.addEventListener("click", () => { window.__sent.push(box.innerText.trim()); box.textContent = ""; sync(); });
  document.getElementById("searchbtn").addEventListener("click", () => { document.getElementById("searchdlg").hidden = false; setTimeout(() => document.getElementById("q").focus(), 80); });
  document.getElementById("alpha").addEventListener("click", (e) => { e.preventDefault(); setTimeout(() => { document.getElementById("proj").hidden = false; thread.hidden = true; }, 150); });
  document.getElementById("projchat").addEventListener("click", () => { window.__clicks.push("projchat"); document.getElementById("proj").hidden = true; thread.hidden = false; box.focus(); });
  document.getElementById("plus").addEventListener("click", () => window.__clicks.push("plus"));
  document.getElementById("mic").addEventListener("click", () => window.__clicks.push("mic"));
  document.querySelectorAll("#side a.chat").forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); window.__clicks.push("chat:" + a.textContent); }));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.getElementById("searchdlg").hidden = true; });
</script>
</body></html>
