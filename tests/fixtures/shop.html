<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Test Shop</title>
<style>
  body{font:16px system-ui;margin:0;padding:16px}
  .card{border:1px solid #ccc;padding:12px;margin:12px 0;display:flex;gap:16px;align-items:center}
  .spacer{height:1600px;background:linear-gradient(#fff,#ddd)}
  #sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50}
  #sheet[hidden]{display:none}
  .sheet-body{background:#fff;padding:24px;border-radius:8px}
</style>
</head>
<body>
  <form role="search" action="/shop.html" method="get">
    <input type="search" name="q" aria-label="Search the shop" placeholder="Search">
    <button type="submit">Go</button>
  </form>
  <p>Cart: <span id="cart-count">0</span> | <span id="order-status"></span></p>

  <div class="card"><a href="#p1" onclick="select('boAt headphones');return false">boAt Rockerz 450 Bluetooth Headphones</a><span>Rs 1,499</span></div>
  <div class="card"><a href="#p2" onclick="select('Sony headphones');return false">Sony WH-CH520 Wireless Headphones</a><span>Rs 3,990</span></div>
  <div class="card"><a href="#p3" onclick="select('JBL headphones');return false">JBL Tune 510BT On-Ear Headphones</a><span>Rs 2,999</span></div>

  <p>Selected: <span id="selected">none</span></p>
  <!-- Amazon-style button: the real <input> is fully transparent and sits on top of a styled, non-interactive label -->
  <span style="position:relative;display:inline-block;background:#fd0;padding:8px 14px;border-radius:8px">
    <span>Add to Cart</span>
    <input type="button" id="add" value="Add to Cart" title="Add to Cart"
           style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer"
           onclick="count.textContent = +count.textContent + 1">
  </span>
  <button id="buy" onclick="document.getElementById('order-status').textContent='ORDER PLACED'">Buy Now</button>
  <textarea aria-label="Gift note" rows="2"></textarea>

  <!-- Two kinds of popup. Native <dialog>: has a Close button. Custom overlay: no button, closes on Escape. -->
  <button id="sub" onclick="document.getElementById('sub-status').textContent='SUBSCRIBED'">Subscribe</button> <span id="sub-status"></span>
  <button id="open-help" onclick="help.showModal()">Help</button>
  <button id="open-sheet" onclick="sheet.hidden=false">Offers</button>
  <dialog id="help"><p>Delivery takes two days.</p><button onclick="help.close()">Close</button></dialog>
  <div id="sheet" hidden role="dialog" aria-label="Offer details"><div class="sheet-body">Offer details <a href="#terms">Read terms</a></div></div>

  <div class="spacer"></div>
  <a href="#end" id="end">Bottom link</a>
  <a href="/grocery.html" id="newtab" target="_blank">Open the grocery page in a new tab</a>

<script>
  const count = document.getElementById('cart-count');
  function select(name){ document.getElementById('selected').textContent = name; }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.getElementById('sheet').hidden = true });
</script>
</body>
</html>
