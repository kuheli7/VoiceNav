<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoiceNav log</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#15171a; --dim:#5c6370; --line:#dde1e7; --ok:#14804a; --bad:#c62839; --help:#9a6700; --accent:#1d4ed8; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#101215; --card:#1a1d22; --ink:#eceef1; --dim:#9aa2ae; --line:#2b2f36; --ok:#41c783; --bad:#ff6b7a; --help:#e3b341; --accent:#7aa2ff; } }
  :root[data-theme="dark"] { --bg:#101215; --card:#1a1d22; --ink:#eceef1; --dim:#9aa2ae; --line:#2b2f36; --ok:#41c783; --bad:#ff6b7a; --help:#e3b341; --accent:#7aa2ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 2px; }
  .sub { color: var(--dim); margin: 0 0 18px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin: 12px 0; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 16px; }
  .stat b { display:block; font-size:22px; }
  .ok b { color:var(--ok); } .bad b { color:var(--bad); }
  button, select { font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; }
  button[aria-pressed="true"] { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.danger { color:var(--bad); }
  button:focus-visible, select:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  h2 { font-size: 16px; margin: 26px 0 8px; }
  .tablewrap { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:12px; }
  table { border-collapse: collapse; width:100%; min-width: 640px; }
  th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); vertical-align: top; }
  th { color:var(--dim); font-weight:600; font-size:13px; }
  tr:last-child td { border-bottom:0; }
  .tag { font-size:12px; border-radius:999px; padding:1px 8px; border:1px solid currentColor; white-space:nowrap; }
  .tag.ok { color:var(--ok); } .tag.bad { color:var(--bad); } .tag.help { color:var(--help); }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .empty { padding: 22px; color: var(--dim); }
  .dim { color: var(--dim); }
</style>
</head>
<body>
<main>
  <h1>VoiceNav log</h1>
  <p class="sub">What you asked for, whether it worked, and on which site. Stored only on this computer. What you type or dictate is not kept, only that you did.</p>

  <div class="row" id="stats" aria-live="polite"></div>

  <div class="row" role="group" aria-label="Show">
    <button id="f-failed" aria-pressed="true">Didn't work</button>
    <button id="f-ok" aria-pressed="false">Worked</button>
    <button id="f-all" aria-pressed="false">All</button>
    <label class="dim" for="site">Site</label>
    <select id="site"><option value="">All sites</option></select>
    <span style="flex:1"></span>
    <button id="dl-json">Download JSON</button>
    <button id="dl-csv">Download CSV</button>
    <button id="clear" class="danger">Clear log</button>
  </div>

  <h2 id="common-h">Most common problems</h2>
  <div class="tablewrap" id="common"></div>

  <h2>Commands</h2>
  <div class="tablewrap" id="list"></div>
</main>
<script src="options.js"></script>
</body>
</html>
