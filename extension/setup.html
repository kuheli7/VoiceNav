<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allow the microphone - VoiceNav</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f9; --fg: #14171c; --muted: #4b5563; --accent: #1a56db; --ok: #0a7a3d; --bad: #b42318; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14171c; --fg: #eef0f3; --muted: #aab2bd; --accent: #7aa7ff; --ok: #5ed08f; --bad: #ff8a7a; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 18px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 34rem; padding: 2rem 1.25rem; }
  h1 { font-size: 1.6rem; margin: 0 0 .75rem; }
  #msg { font-size: 1.2rem; margin: 0 0 1.25rem; }
  body[data-state="granted"] #msg { color: var(--ok); }
  body[data-state="blocked"] #msg, body[data-state="nomic"] #msg { color: var(--bad); }
  button { font: inherit; font-weight: 600; padding: .8rem 1.4rem; border: 0; border-radius: .6rem; background: var(--accent); color: var(--bg); cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  .fine { color: var(--muted); font-size: .95rem; margin-top: 1.5rem; }
</style>
<main>
  <h1>One-time setup</h1>
  <p id="msg" role="status" aria-live="polite">Chrome is asking to use your microphone. Choose Allow.</p>
  <button id="go" type="button" hidden>Allow the microphone</button>
  <p class="fine">You only do this once. After it, VoiceNav listens on every site without asking again. If Chrome offers <b>Allow this time</b>, choose <b>Allow while visiting the site</b> instead, or it will ask again later.</p>
</main>
<script src="setup.js"></script>
